<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Spade Network</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 44px;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .spade { color: #ef4444; font-size: 30px; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .now-playing {
      color: #a1a1aa;
      font-size: 14px;
    }
    .badge {
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.08em;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 28px;
      padding: 28px 44px;
      min-height: 0;
    }
    .player-stage {
      background: #000000;
      border: 2px solid #27272a;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      object-fit: contain;
    }
    .hidden { display: none !important; }
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      z-index: 2;
      pointer-events: none;
    }
    .status-overlay h2 { font-size: 28px; margin-bottom: 10px; }
    .status-overlay p { color: #a1a1aa; font-size: 16px; max-width: 520px; line-height: 1.5; }
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .channel-btn {
      background: #18181b;
      color: #f4f4f5;
      border: 2px solid #27272a;
      border-radius: 14px;
      padding: 20px 22px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .channel-btn:focus, .channel-btn.active {
      outline: none;
      border-color: #ef4444;
      background: #231517;
      transform: scale(1.02);
    }
    .channel-title { font-size: 19px; font-weight: 700; margin-bottom: 5px; }
    .channel-meta { font-size: 13px; color: #a1a1aa; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="spade">♠</span> RED SPADE NETWORK</div>
    <div class="header-right">
      <span class="now-playing" id="now-playing">01 · Main Broadcast</span>
      <div class="badge">LIVE PORTAL</div>
    </div>
  </header>

  <main>
    <section class="player-stage" id="stage">
      <video id="video-player" playsinline controls autoplay muted></video>
      <iframe id="embed-player" class="hidden" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      <div class="status-overlay" id="status-overlay">
        <h2 id="status-title">Loading Stream...</h2>
        <p id="status-desc">Connecting to Red Spade Network feed.</p>
      </div>
    </section>

    <aside class="channel-list" id="channels">
      <button class="channel-btn active" data-index="0">
        <div class="channel-title">01 · Main Broadcast</div>
        <div class="channel-meta">Flagship Live Channel · HLS</div>
      </button>
      <button class="channel-btn" data-index="1">
        <div class="channel-title">02 · Live Events</div>
        <div class="channel-meta">Specials &amp; Premieres · MP4</div>
      </button>
      <button class="channel-btn" data-index="2">
        <div class="channel-title">03 · On-Demand Vault</div>
        <div class="channel-meta">Replays &amp; Clips · MP4</div>
      </button>
    </aside>
  </main>

  <script>
    // Replace these URLs with your own feeds anytime (type: "hls", "mp4", or "embed")
    const CHANNELS = [
      {
        code: "01",
        name: "Main Broadcast",
        type: "hls",
        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        code: "02",
        name: "Live Events",
        type: "mp4",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
      },
      {
        code: "03",
        name: "On-Demand Vault",
        type: "mp4",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      }
    ];

    const buttons = Array.from(document.querySelectorAll(".channel-btn"));
    const videoEl = document.getElementById("video-player");
    const iframeEl = document.getElementById("embed-player");
    const overlayEl = document.getElementById("status-overlay");
    const statusTitleEl = document.getElementById("status-title");
    const statusDescEl = document.getElementById("status-desc");
    const nowPlayingEl = document.getElementById("now-playing");

    let hlsInstance = null;
    let currentIndex = 0;

    function showStatus(title, desc) {
      statusTitleEl.textContent = title;
      statusDescEl.textContent = desc;
      overlayEl.classList.remove("hidden");
    }

    function hideStatus() {
      overlayEl.classList.add("hidden");
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function playChannel(index) {
      currentIndex = (index + CHANNELS.length) % CHANNELS.length;
      buttons.forEach((btn, i) => btn.classList.toggle("active", i === currentIndex));
      if (buttons[currentIndex]) buttons[currentIndex].focus();

      const ch = CHANNELS[currentIndex];
      nowPlayingEl.textContent = ch.code + " · " + ch.name;

      destroyHls();
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load();
      iframeEl.src = "";

      if (!ch.url || !ch.url.trim()) {
        videoEl.classList.add("hidden");
        iframeEl.classList.add("hidden");
        showStatus(ch.code + " · " + ch.name, "No stream URL configured yet for this channel.");
        return;
      }

      if (ch.type === "embed") {
        videoEl.classList.add("hidden");
        iframeEl.classList.remove("hidden");
        iframeEl.src = ch.url;
        hideStatus();
        return;
      }

      iframeEl.classList.add("hidden");
      videoEl.classList.remove("hidden");
      showStatus("Loading " + ch.name + "...", "Connecting to broadcast stream.");

      if (ch.type === "hls" && window.Hls && window.Hls.isSupported()) {
        hlsInstance = new window.Hls({ enableWorker: true });
        hlsInstance.loadSource(ch.url);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function () {
          hideStatus();
          videoEl.play().catch(function () {});
        });
        hlsInstance.on(window.Hls.Events.ERROR, function (_, data) {
          if (data && data.fatal) {
            showStatus("Stream Unavailable", "Could not load HLS feed for " + ch.name + ".");
          }
        });
      } else {
        videoEl.src = ch.url;
        videoEl.oncanplay = function () {
          hideStatus();
          videoEl.play().catch(function () {});
        };
        videoEl.onerror = function () {
          showStatus("Stream Unavailable", "Could not load media feed for " + ch.name + ".");
        };
      }
    }

    buttons.forEach(function (btn, idx) {
      btn.addEventListener("click", function () {
        playChannel(idx);
      });
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        playChannel(currentIndex + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        playChannel(currentIndex - 1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        playChannel(currentIndex);
      }
    });

    playChannel(0);
  </script>

<script>
(async function syncRedSpadeFeed() {
  const feedUrl = "https://r3dpr1nts2ud10z.github.io/red-Spade-network/s2ud10z_render_engine/out/channel_feed.json";
  const channelList = document.getElementById("channels");
  if (!channelList) return;

  try {
    const res = await fetch(`${feedUrl}?t=${Date.now()}`);
    if (!res.ok) return;
    const data = await res.json();
    const episodes = Array.isArray(data.episodes) ? data.episodes : [];
    if (!episodes.length) return;

    episodes.forEach((ep) => {
      const streamUrl = (ep.streams && (ep.streams.hls || ep.streams.mp4)) || "";
      if (!streamUrl) return;
      if (channelList.querySelector(`[data-feed-url="${streamUrl}"]`)) return;

      const idx = channelList.querySelectorAll(".channel-btn").length;
      const btn = document.createElement("button");
      btn.className = "channel-btn";
      btn.setAttribute("data-index", String(idx));
      btn.setAttribute("data-feed-url", streamUrl);

      const title = ep.title || ep.job_id || `Episode ${idx + 1}`;
      const meta = ep.channel_id || "S2UD10Z Render Engine";

      const titleDiv = document.createElement("div");
      titleDiv.className = "channel-title";
      titleDiv.textContent = title;

      const metaDiv = document.createElement("div");
      metaDiv.className = "channel-meta";
      metaDiv.textContent = meta;

      btn.appendChild(titleDiv);
      btn.appendChild(metaDiv);

      if (typeof window.playChannel === "function") {
        btn.addEventListener("click", () => window.playChannel(idx));
      }

      channelList.appendChild(btn);
    });
  } catch (_) {
    // Keep existing static lineup if feed fetch fails
  }
})();
</script>

</body>
</html>
