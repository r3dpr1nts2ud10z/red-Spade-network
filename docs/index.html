<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Spade Network</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 44px;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .spade { color: #ef4444; font-size: 30px; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .now-playing {
      color: #a1a1aa;
      font-size: 14px;
    }
    .badge {
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.08em;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 28px;
      padding: 28px 44px;
      min-height: 0;
    }
    .player-stage {
      background: #000000;
      border: 2px solid #27272a;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      object-fit: contain;
    }
    .hidden { display: none !important; }
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      z-index: 2;
    }
    .status-overlay h2 { font-size: 28px; margin-bottom: 10px; }
    .status-overlay p { color: #a1a1aa; font-size: 16px; max-width: 520px; line-height: 1.5; }
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .channel-btn {
      background: #18181b;
      color: #f4f4f5;
      border: 2px solid #27272a;
      border-radius: 14px;
      padding: 20px 22px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .channel-btn:focus, .channel-btn.active {
      outline: none;
      border-color: #ef4444;
      background: #231517;
      transform: scale(1.02);
    }
    .channel-title { font-size: 19px; font-weight: 700; margin-bottom: 5px; }
    .channel-meta { font-size: 13px; color: #a1a1aa; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="spade">♠</span> RED SPADE NETWORK</div>
    <div class="header-right">
      <span class="now-playing" id="now-playing">Ready</span>
      <div class="badge">LIVE PORTAL</div>
    </div>
  </header>

  <main>
    <section class="player-stage" id="stage">
      <video id="video-player" playsinline controls autoplay></video>
      <iframe id="embed-player" class="hidden" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      <div class="status-overlay" id="status-overlay">
        <h2 id="status-title">Select a Channel</h2>
        <p id="status-desc">Add your stream URLs to CHANNELS in docs/index.html to start playback.</p>
      </div>
    </section>

    <aside class="channel-list" id="channels"></aside>
  </main>

  <script>
    // Configure your channel feeds here:
    // type: "hls" (.m3u8), "mp4" (.mp4/.webm), or "embed" (iframe URL)
const CHANNELS = [
  {
    code: "01",
    name: "Main Broadcast",
    meta: "Flagship Live Channel",
    type: "mp4", // "mp4", "hls", or "embed"
    url: "https://YOUR_MP4_OR_WEBM_URL"
  },
  {
    code: "02",
    name: "Live Events",
    meta: "Specials & Premieres",
    type: "hls",
    url: "https://YOUR_STREAM_URL.m3u8"
  },
  {
    code: "03",
    name: "On-Demand Vault",
    meta: "Replays & Clips",
    type: "embed",
    url: "https://YOUR_EMBED_PLAYER_URL"
  }
];{
        code: "01",
        name: "Main Broadcast",
        meta: "Flagship Live Channel",
        type: "mp4",
        url: ""
      },
      {
        code: "02",
        name: "Live Events",
        meta: "Specials & Premieres",
        type: "hls",
        url: ""
      },
      {
        code: "03",
        name: "On-Demand Vault",
        meta: "Replays & Clips",
        type: "mp4",
        url: ""
      }
    ];

    const listEl = document.getElementById("channels");
    const videoEl = document.getElementById("video-player");
    const iframeEl = document.getElementById("embed-player");
    const overlayEl = document.getElementById("status-overlay");
    const statusTitleEl = document.getElementById("status-title");
    const statusDescEl = document.getElementById("status-desc");
    const nowPlayingEl = document.getElementById("now-playing");

    let hlsInstance = null;
    let currentIndex = 0;

    function showStatus(title, desc) {
      statusTitleEl.textContent = title;
      statusDescEl.textContent = desc;
      overlayEl.classList.remove("hidden");
    }

    function hideStatus() {
      overlayEl.classList.add("hidden");
    }

    function destroyHls() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    function playChannel(index) {
      currentIndex = (index + CHANNELS.length) % CHANNELS.length;
      const buttons = Array.from(document.querySelectorAll(".channel-btn"));
      buttons.forEach((btn, i) => btn.classList.toggle("active", i === currentIndex));
      if (buttons[currentIndex]) buttons[currentIndex].focus();

      const ch = CHANNELS[currentIndex];
      nowPlayingEl.textContent = `${ch.code} · ${ch.name}`;

      destroyHls();
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load();
      iframeEl.src = "";

      if (!ch.url || !ch.url.trim()) {
        videoEl.classList.add("hidden");
        iframeEl.classList.add("hidden");
        showStatus(
          `${ch.code} · ${ch.name}`,
          `No stream URL configured yet for this channel. Set a valid ${ch.type.toUpperCase()} or embed URL in docs/index.html.`
        );
        return;
      }

      if (ch.type === "embed") {
        videoEl.classList.add("hidden");
        iframeEl.classList.remove("hidden");
        iframeEl.src = ch.url;
        hideStatus();
        return;
      }

      iframeEl.classList.add("hidden");
      videoEl.classList.remove("hidden");
      showStatus(`Loading ${ch.name}...`, "Connecting to broadcast stream.");

      if (ch.type === "hls" && window.Hls && window.Hls.isSupported()) {
        hlsInstance = new window.Hls({ enableWorker: true });
        hlsInstance.loadSource(ch.url);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => {
          hideStatus();
          videoEl.play().catch(() => {});
        });
        hlsInstance.on(window.Hls.Events.ERROR, (_, data) => {
          if (data && data.fatal) {
            showStatus("Stream Unavailable", `Could not load HLS feed for ${ch.name}.`);
          }
        });
      } else {
        videoEl.src = ch.url;
        videoEl.oncanplay = () => {
          hideStatus();
          videoEl.play().catch(() => {});
        };
        videoEl.onerror = () => {
          showStatus("Stream Unavailable", `Could not load media feed for ${ch.name}.`);
        };
      }
    }

    CHANNELS.forEach((ch, idx) => {
      const btn = document.createElement("button");
      btn.className = "channel-btn";
      btn.innerHTML = `
        <div class="channel-title">${ch.code} · ${ch.name}</div>
        <div class="channel-meta">${ch.meta} · ${ch.type.toUpperCase()}</div>
      `;
      btn.addEventListener("click", () => playChannel(idx));
      listEl.appendChild(btn);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        playChannel(currentIndex + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        playChannel(currentIndex - 1);
      } else if (e.key === "Enter") {
        const activeBtn = document.querySelectorAll(".channel-btn")[currentIndex];
        if (activeBtn && document.activeElement !== activeBtn) {
          e.preventDefault();
          playChannel(currentIndex);
        }
      }
    });

    playChannel(0);
  </script>
</body>
</html>
