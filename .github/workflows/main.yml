mkdir -p .github/workflows

cat << 'EOF' > .github/workflows/main.yml
name: Android CI

"on":
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-spade-network-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
EOF

head -n 10 .github/workflows/main.yml
git add .github/workflows/main.yml && git commit -m "Fix line 4 YAML syntax in main.yml" && git push origin main
